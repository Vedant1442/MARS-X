name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - nipun_branch
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name mars_x .
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build split release APKs
        working-directory: mobile
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64

      - name: Verify APK files
        run: |
          ls -lh mobile/build/app/outputs/flutter-apk/
          test -f mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mars-x-android-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
