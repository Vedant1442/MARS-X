<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>MARS-X · Interplanetary Surface Planning</title>
    <meta name="description" content="Plan and analyze candidate Mars exploration routes using NASA data, terrain intelligence, and science targets." />
    
    <!-- PWA & Mobile Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#964630" />

    <!-- iOS Safari & Home Screen Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MARS-X" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Android Chrome Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="MARS-X" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW registration note:', err));
        });
      }
    </script>
  </body>
</html>
