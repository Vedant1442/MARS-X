name: mars_x
description: Offline Mars surface excursion planner for the crater-wide Jezero CTX terrain mosaic.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  fl_chart: ^0.68.0
  pdf: ^3.11.1
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/terrain/jezero-dem.bin
    - assets/terrain/jezero-dem.json
    - assets/terrain/jezero-ctx-100m-elevation.bin
    - assets/terrain/jezero-ctx-100m-elevation.json
    - assets/terrain/jezero-ctx-overview.png
    - assets/terrain/jezero-ctx-crater-rim.geojson
    - assets/terrain/jezero-landmarks.geojson
    - assets/terrain/perseverance-rover-stops.geojson
    - assets/images/
